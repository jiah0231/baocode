# One-time exact-byte source transport. This workflow removes itself before the
# final tree is recorded. It never builds, signs, publishes or changes settings.
name: Prepare exact upstream 35 source
on:
  create:
permissions:
  contents: write
concurrency:
  group: prepare-exact-upstream35-source
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'jiah0231/baocode' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'source-prepare/upstream35-20261105'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Restore one original generated source file and verify final tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, gzip, hashlib
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(Path('tool/ci/merge35-localizations.gz.b64').read_text(), validate=False))
          assert len(data) == 693358, 'Unexpected source size'
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == '3d520602a2deb37351d7f84db7a6e4f258c8bfbf', 'Source Git blob mismatch'
          Path('lib/l10n/app_localizations.dart').write_bytes(data)
          print('Verified exact source blob:', digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Exact source reconstruction failed' }
          git config core.autocrlf false
          git add -- lib/l10n/app_localizations.dart
          if ($LASTEXITCODE -ne 0) { throw 'Source staging failed' }
          git rm -- .github/workflows/prepare-upstream35-source.yml tool/ci/merge35-localizations.gz.b64
          if ($LASTEXITCODE -ne 0) { throw 'Transport cleanup failed' }
          $tree = (git write-tree).Trim()
          if ($tree -ne '6a64643f6d35d80ea51183cf55624bc460166603') { throw "Final source tree mismatch: $tree" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'build: materialize exact upstream merge source'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:refs/heads/source-prepare/upstream35-20261105
          if ($LASTEXITCODE -ne 0) { throw 'Source publication failed' }
          Write-Host "Verified source tree: $tree"
          git rev-parse HEAD
