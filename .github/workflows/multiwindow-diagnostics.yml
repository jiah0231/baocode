name: Windows lock fixture diagnostics
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
jobs:
  replay:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - name: Original paused-stdout lock fixture
        continue-on-error: true
        run: dart --disable-dart-dev tool/ci/diagnose_stdin_lock.dart
      - name: Paused-stdout lock fixture with explicit EOF
        run: dart --disable-dart-dev tool/ci/diagnose_stdin_lock.dart close
