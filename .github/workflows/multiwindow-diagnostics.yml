# Replay an already-built, exact-source CI bundle on a disposable desktop.
# Diagnostics only: no signing, release, permissions changes or user profile.
name: Windows multiwindow diagnostics
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 42567821040
          name: translation-test-bundle-9a1f80831860bbbf5456b6b4ced018c88c015211
          path: build/replay
      - name: Replay cold and warm window requests
        shell: pwsh
        run: ./tool/ci/windows_multiwindow_smoke.ps1 -Executable build/replay/baocode.exe
