# Non-publishing checks for the Windows taskbar task and shared-engine windows.
name: Windows lock fixture diagnostics
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiwindow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore original bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Asset reconstruction changed tracked source' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve packages and localization
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs' }
      - run: flutter analyze --no-pub --fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib/window/app_windows.dart lib/window/code_args.dart test/window/app_windows_test.dart test/window/code_args_test.dart test/window/multi_window_test.dart test/window/window_chat_state_test.dart test/workspace/window_agent_draft_test.dart lib/workspace/workspace.dart lib/workbench.dart lib/workspace/open_in_editor_button.dart lib/workspace/new_chat_folder_bar.dart lib/workspace/window_header/window_header.dart lib/sidebar/sidebar.dart
      - name: Repeat unchanged usage-lock fixture with stage diagnostics
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            flutter test --no-pub --reporter expanded test/usage/usage_storage_queue_test.dart
            if ($LASTEXITCODE -ne 0) { throw 'Focused usage fixture failed' }
          }
      - name: Repeat exact preserved Codex and performance suite
        run: flutter test --no-pub --reporter expanded test/kernel test/usage test/models/proxy test/models/codex_test.dart test/codex_fork_test.dart test/chat/streamed_words_test.dart
