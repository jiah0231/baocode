# Same-request focused-window experiment; original strict gates remain intact.
name: Windows cold UIA entry comparison
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, foreground_handle]
        replica: [1, 2, 3, 4, 5, 6]
    env:
      BAOCODE_DISPOSABLE_UI_TEST: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Capture before any other UIA consumer in this runner
        shell: pwsh
        run: |
          $failures = 0
          1..3 | ForEach-Object {
            $case = $_
            Write-Host "ENTRY_CASE_BEGIN|mode=${{ matrix.mode }}|replica=${{ matrix.replica }}|case=$case"
            try {
              $probe = '${{ matrix.mode }}' -eq 'foreground_handle'
              ./tool/ci/windows_translation_browser_smoke.ps1 -OutputDirectory "build/entry/case-$case" -SkipPostFailureUiaDiagnostics -ForegroundConnectionExperiment:$probe
              Write-Host "ENTRY_CASE_END|case=$case|result=success"
            } catch {
              $failures++
              Write-Host "ENTRY_CASE_END|case=$case|result=failure|reason=$_"
            }
          }
          Write-Host "ENTRY_MATRIX_SUMMARY|mode=${{ matrix.mode }}|replica=${{ matrix.replica }}|total=3|failures=$failures"
          if ($failures -ne 0) { throw "$failures strict captures failed; no failure converted to success" }
      - name: Preserve synthetic mismatch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: entry-${{ matrix.mode }}-${{ matrix.replica }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: build/entry/**/*.png
