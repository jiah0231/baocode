# Diagnostics only. Original deadlines, assertions and failure outcomes remain intact.
name: Windows cold UIA diagnostics
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
jobs:
  cold_capture:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        context: [fresh, after_release_native_checks]
    env:
      BAOCODE_DISPOSABLE_UI_TEST: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Match preceding release native checks
        if: matrix.context == 'after_release_native_checks'
        shell: pwsh
        run: |
          ./tool/ci/windows_translation_smoke.ps1
          ./tool/ci/windows_translation_clipboard_smoke.ps1
          ./tool/ci/windows_translation_action_smoke.ps1
      - name: Measure ten unchanged cold browser requests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failures = 0
          1..10 | ForEach-Object {
            $case = $_
            Write-Host "COLD_CASE_BEGIN|context=${{ matrix.context }}|case=$case"
            try {
              ./tool/ci/windows_translation_browser_smoke.ps1 -OutputDirectory "build/cold-uia/case-$case" -SkipPostFailureUiaDiagnostics
              Write-Host "COLD_CASE_END|case=$case|result=success"
            } catch {
              $failures++
              Write-Host "COLD_CASE_END|case=$case|result=failure|reason=$_"
            }
          }
          Write-Host "COLD_MATRIX_SUMMARY|context=${{ matrix.context }}|total=10|failures=$failures"
          if ($failures -ne 0) { throw "$failures strict cold captures failed; no failure converted to success" }
      - name: Preserve isolated synthetic mismatch screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cold-uia-${{ matrix.context }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: build/cold-uia/**/*.png
