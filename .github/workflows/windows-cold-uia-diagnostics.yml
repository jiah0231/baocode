# Guard verification only. No UIA tracing or Edge launch is allowed here.
name: Verify scoped timing consumer synchronization
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
jobs:
  selftest:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      BAOCODE_DISPOSABLE_UI_TEST: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify private probe filters and reviewed numeric schema only
        shell: pwsh
        run: |
          $failures = 0
          1..5 | ForEach-Object {
            Write-Host "PROBE_REPEAT_BEGIN|replica=${{ matrix.replica }}|case=$_"
            try {
              ./tool/ci/windows_translation_browser_smoke.ps1 -ScopedTimingTraceSelfTest -SkipPostFailureUiaDiagnostics
              Write-Host "PROBE_REPEAT_END|case=$_|result=success"
            } catch {
              $failures++
              Write-Host "PROBE_REPEAT_END|result=failure|reason=$_"
            }
          }
          Write-Host "PROBE_REPEAT_SUMMARY|replica=${{ matrix.replica }}|total=5|failures=$failures"
          if ($failures -ne 0) { throw "$failures private probe checks failed; failures remain failures" }
