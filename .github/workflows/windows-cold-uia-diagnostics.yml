# Guard verification only. No UIA tracing or Edge launch is allowed here.
name: Verify scoped UIA timing guards
on:
  push:
    branches: ['validation/windows-new-window-diagnostics']
permissions:
  contents: read
jobs:
  selftest:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      BAOCODE_DISPOSABLE_UI_TEST: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify private probe filters and reviewed numeric schema only
        shell: pwsh
        run: ./tool/ci/windows_translation_browser_smoke.ps1 -ScopedTimingTraceSelfTest -SkipPostFailureUiaDiagnostics
