# Non-publishing checks for the Windows taskbar task and shared-engine windows.
name: Windows multiwindow validation
on:
  push:
    branches: ['feat/windows-new-window', 'feat/global-translation-floating-window']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiwindow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore original bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Asset reconstruction changed tracked source' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve packages and localization
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs' }
      - run: flutter analyze --no-pub --fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib/window/app_windows.dart lib/window/code_args.dart test/window/app_windows_test.dart test/window/code_args_test.dart test/window/multi_window_test.dart test/window/window_chat_state_test.dart test/workspace/window_agent_draft_test.dart lib/workspace/workspace.dart lib/workbench.dart lib/workspace/open_in_editor_button.dart lib/workspace/new_chat_folder_bar.dart lib/workspace/window_header/window_header.dart lib/sidebar/sidebar.dart
      - name: Test window and launch regressions
        run: flutter test --no-pub --reporter expanded --timeout 2m test/window test/workspace/window_agent_draft_test.dart test/platform/open_requests_test.dart test/keybindings/window_keybindings_test.dart test/update/version_test.dart test/update/custom_release_manifest_test.dart
      - name: Test upstream v1.9.2 application regressions
        run: >-
          flutter test --no-pub --reporter expanded --timeout 2m
          packages/bao_agent/test/engine/tools_test.dart
          packages/bao_agent/test/units/utils_test.dart
          test/chat/change_tree_test.dart
          test/chat/history_scroll_test.dart
          test/chat_grid_test.dart
          test/kernel_test.dart
          test/models/magpie_test.dart
          test/models/models_test.dart
          test/models/proxy/model_proxy_test.dart
          test/models/proxy/opencode_routing_test.dart
          test/platform/open_requests_test.dart
          test/remote/remote_binaries_test.dart
          test/remote/remote_server_test.dart
          test/remote/ssh_launcher_test.dart
          test/settings/models_page_test.dart
          test/steps_test.dart
          test/workspace_test.dart
          test/workspace/window_pane_restore_test.dart
      - name: Build actual Windows release app
        id: build
        shell: pwsh
        run: |
          dart run tool/build_windows.dart --arch x64 --custom-updates --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
      - name: Verify taskbar metadata and shell registration
        shell: pwsh
        run: ./tool/ci/windows_taskbar_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
      - name: Verify real native windows and single-instance forwarding
        shell: pwsh
        run: ./tool/ci/windows_multiwindow_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
      - name: Keep isolated native failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: multiwindow-failure-evidence-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/baocode-multiwindow-diagnostics/
      - name: Keep test-only release bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: multiwindow-test-bundle-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: build/windows/x64/runner/Release/
