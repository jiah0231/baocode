# Focused Windows checks for intermittent UI lag. No browser, build or release.
name: Intermittent lag regression checks
on:
  push:
    branches: ['validation/lag-*']
permissions:
  contents: read
concurrency:
  group: lag-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'jiah0231/baocode' && startsWith(github.ref, 'refs/heads/validation/lag-')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact offline preview bundles and corresponding source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tool/ci/test_reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview transport unit tests failed' }
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview original-byte reconstruction failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction changed tracked source' }
      - name: Verify and reassemble the unchanged Maple font
        id: font_asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs before font reconstruction' }
          python tool/ci/test_reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction unit tests failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Original font reconstruction failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction modified tracked source' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: false
      # Unit tests can require the project's native FFI dependency. Restoring
      # it (or compiling it) does not start BaoCode or a browser.
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve packages and localization
        id: preparation
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization generation failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Preparation changed tracked candidate source' }
      - name: Analyze exact candidate
        id: analyze
        run: flutter analyze --no-pub --fatal-infos
      - name: Format only changed Dart files
        id: format
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'e96f2988cad960b22f3f98b54c5e0337edcc9fcf'
          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- '*.dart')
          if ($LASTEXITCODE -ne 0) { throw 'Changed Dart enumeration failed' }
          if ($files.Count) {
            dart format --output=none --set-exit-if-changed @files
            if ($LASTEXITCODE -ne 0) {
              dart format @files
              New-Item -ItemType Directory -Force build/lag-evidence | Out-Null
              git diff --output=build/lag-evidence/format.patch HEAD -- @files
              git restore --worktree --source=HEAD -- @files
              throw 'Changed files need formatting; exact candidate restored'
            }
          }
      - name: Run focused history and file reference regressions
        id: regressions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test --no-pub --reporter expanded --timeout 2m
          test/chat/chat_history_rebuild_test.dart
          test/chat/history_stream_batch_test.dart
          test/chat/history_paging_test.dart
          test/chat/history_scroll_test.dart
          test/chat/history_selection_test.dart
          test/chat/streamed_words_test.dart
          test/chat/step_folds_test.dart
          test/chat/fold_view_test.dart
          test/chat/files_seen_test.dart
      - name: Prove performance regressions fail on released +37
        if: ${{ !cancelled() && steps.regressions.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @('lib/chat/chat_history_view.dart', 'lib/chat/chat_session.dart')
          git restore --worktree --source=e96f2988cad960b22f3f98b54c5e0337edcc9fcf -- @sources
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore the released baseline' }
          try {
            $cases = @(
              @('test/chat/history_stream_batch_test.dart', 'waiting word deltas do not rescan a long history', 'Expected: a value less than <2000>'),
              @('test/chat/files_seen_test.dart', 'streaming text does not rescan previously seen tools', 'Expected: <')
            )
            foreach ($case in $cases) {
              $output = @(flutter test --no-pub --reporter expanded --timeout 2m $case[0] --plain-name $case[1] 2>&1)
              $code = $LASTEXITCODE
              $output | ForEach-Object { Write-Host $_ }
              $text = $output -join "`n"
              if ($code -eq 0 -or -not $text.Contains($case[2]) -or -not $text.Contains('Actual: <')) {
                throw "Released baseline did not fail the intended traversal-count assertion: $($case[1])"
              }
              Write-Host "Confirmed: released +37 fails the new traversal-count assertion: $($case[1])"
            }
          } finally {
            git restore --worktree --source=HEAD -- @sources
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore exact candidate' }
          }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate source was not restored' }
          exit 0
      - name: Retain formatter diagnostics
        if: ${{ always() && hashFiles('build/lag-evidence/*.patch') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: lag-formatter-${{ github.sha }}
          path: build/lag-evidence/*.patch
          retention-days: 7
