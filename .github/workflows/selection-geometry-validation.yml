# Isolated native regression only. No app publication or live translation calls.
name: Selection geometry validation
on:
  push:
    branches: ['fix/pdf-selection-geometry-20261110', 'feat/global-translation-floating-window']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test pure geometry and native selection invariants
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_smoke.ps1
      - name: Test gesture rejection and bound click races on fresh fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: |
          1..3 | ForEach-Object {
            ./tool/ci/windows_translation_action_smoke.ps1
          }
