# A fork-only test build: no tags, releases, credentials, or upstream upload.
name: Codex parity Windows build
on:
  push:
    branches: [fix/codex-parity-windows-20261101]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-parity-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.47.5
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bao-iroh-prebuilt
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Generate localization bindings
        run: flutter gen-l10n
      - name: Analyze
        id: analyze
        run: flutter analyze --no-pub
      - name: Build and test owned Windows Codex launcher
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S windows/codex_launcher -B build/codex-launcher-fixture -A x64 -DBAOCODE_LAUNCHER_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher configure failed' }
          cmake --build build/codex-launcher-fixture --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher build failed' }
          $fixture = Join-Path $PWD 'build/codex-launcher-fixture/Release'
          $helper = Join-Path $fixture 'BaocodeCodexLauncher.exe'
          if (-not (Test-Path -LiteralPath $helper)) { throw 'Owned launcher fixture missing' }
          "BAOCODE_TEST_LAUNCHER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tool/test_codex_owned_launcher.py --helper $helper --reject-job-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectJob.exe') --reject-membership-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectMembership.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher process isolation tests failed' }
      - name: Test Codex provider MCP and shutdown regressions early
        run: >-
          flutter test
          test/kernel/codex_provider_route_test.dart
          test/kernel/codex_owned_process_test.dart
          test/kernel/codex_transport_shutdown_test.dart
          test/kernel/codex_transport_decode_test.dart
          test/kernel/codex_path_setting_test.dart
          test/kernel/codex_bot_kernel_test.dart
          test/kernel/codex_writer_lifecycle_test.dart
      - name: Test Codex installer HTTP diagnostics
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/kernel/codex_install_http_diagnostics_test.dart
      - name: Test original browser regressions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test
          test/browser/browser_analysis_test.dart
          test/browser/browser_bridge_test.dart
          test/browser/browser_numbers_test.dart
          test/browser/browser_steps_test.dart
          test/browser/extension_store_test.dart
          test/browser/source_map_test.dart
      - name: Test Codex approval and edit-review UI early
        run: flutter test test/kernel_ui_test.dart --plain-name "a Codex agent asks leave, and its work can be undone"
      - name: Test selected cross-kernel session retrieval
        run: flutter test test/chat/session_query_test.dart test/chat/session_query_queue_test.dart test/chat/session_query_claude_lifecycle_test.dart test/chat/session_mentions_test.dart test/chat/composer_intercept_test.dart test/chat/composer_draft_sync_test.dart test/workspace/session_query_workspace_test.dart
      - name: Repeat writer lifecycle regression with randomized order
        run: |
          foreach ($seed in 101, 211, 307, 401, 503) {
            flutter test test/kernel/codex_writer_lifecycle_test.dart --test-randomize-ordering-seed=$seed
            if ($LASTEXITCODE -ne 0) { throw "Writer lifecycle regression failed (seed $seed)" }
          }
      - name: Test changed components
        run: flutter test test/kernel test/usage test/models/proxy test/workspace/usage_shutdown_test.dart test/workspace/quit_confirmation_test.dart test/settings/codex_path_settings_test.dart test/settings/codex_install_controls_test.dart test/customize test/bots test/chat/goal_panel_test.dart test/chat/streamed_words_test.dart test/claude_runtime_test.dart test/models/codex_test.dart test/models/codex_quota_format_test.dart test/update test/link/chat_codec_test.dart test/ide/lsp/packs/lsp_settings_template_test.dart
      - name: Test custom update channel fail-closed configuration
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/update/custom_update_channel_test.dart --dart-define=BAOCODE_CUSTOM_UPDATES=true
      - name: Test Codex adapter integration
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/kernel_test.dart --plain-name "Codex adapter"
      - name: Test conversation fork parity
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/codex_fork_test.dart
      - name: Verify official Codex package and offline app-server APIs
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        env:
          BAOCODE_CODEX_OFFICIAL_SMOKE: '1'
        run: flutter test test/kernel/codex_official_smoke_test.dart --timeout 10m
      - name: Test upstream edit ledger and legacy SSH compatibility
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test
          test/chat/change_review_test.dart
          test/chat/checkpoints_tidy_test.dart
          test/chat/legacy_review_import_test.dart
          test/chat/line_diff_test.dart
          test/chat/session_review_test.dart
          test/remote/remote_review_compat_test.dart
          test/remote/remote_server_test.dart
          packages/bao_agent/test/engine/host_hooks_test.dart
      - name: Test upstream chat, usage UI, search and editor integration
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test
          test/chat/composer_intercept_test.dart
          test/chat/reset_credits_hint_test.dart
          test/chat/side_panel/file_preview_agent_test.dart
          test/chat/side_panel/side_panel_test.dart
          test/ide/editor/ide_editor_agent_edits_test.dart
          test/ide/git/log_details_copy_test.dart
          test/ide/git/log_diff_test.dart
          test/ide/search/text_search_test.dart
          test/ide/workbench/ide_units_test.dart
          test/usage_panel_test.dart
          test/workspace/aside_test.dart
          test/workspace/chat_branch_bar_test.dart
          test/workspace/chat_quota_bar_test.dart
      - name: Test full kernel integration and current phone protocol
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/kernel_test.dart test/link
      - name: Test all upstream changed regressions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test
          test/base/mouse_navigation_test.dart
          test/bots/bots_test.dart
          test/chat/change_review_test.dart
          test/chat/checkpoints_tidy_test.dart
          test/chat/composer_draft_sync_test.dart
          test/chat/composer_intercept_test.dart
          test/chat/goal_panel_test.dart
          test/chat/history_selection_test.dart
          test/chat/session_mentions_test.dart
          test/chat/side_panel/side_panel_reopen_diff_test.dart
          test/chat/side_panel/side_panel_test.dart
          test/chat/streamed_words_test.dart
          test/chat_split_test.dart
          test/claude_haiku_test.dart
          test/customize/customize_view_test.dart
          test/diagnostics/frame_watch_test.dart
          test/forge/forge_test.dart
          test/forge/forge_tls_test.dart
          test/ide/editor/ide_editor_agent_edits_test.dart
          test/ide/git/log_diff_test.dart
          test/ide/lsp/catalog/bundled_lsp_catalog_test.dart
          test/ide/lsp/core/lsp_manager_test.dart
          test/ide/lsp/core/vue_language_tools_test.dart
          test/ide/lsp/packs/lsp_settings_template_test.dart
          test/ide/lsp/smoke/vue_language_server_smoke_test.dart
          test/ide/search/search_view_test.dart
          test/ide/terminal/links/terminal_links_test.dart
          test/ide/workbench/navigation_history_test.dart
          test/kernel/claude_haiku_test.dart
          test/kernel/claude_sdk_tools_test.dart
          test/kernel/dart_core_e2e_test.dart
          test/kernel_test.dart
          test/kernel_ui_test.dart
          test/keybindings/key_chord_test.dart
          test/link/link_host_test.dart
          test/link/workspace_bridge_test.dart
          test/markdown_test.dart
          test/models/proxy/model_proxy_test.dart
          test/remote/remote_project_test.dart
          test/remote/remote_server_test.dart
          test/settings/mobile_page_test.dart
          test/telemetry/telemetry_service_test.dart
          test/update/update_service_test.dart
          test/usage/claude_usage_meter_test.dart
          test/usage/usage_calls_list_test.dart
          test/usage/usage_ledger_test.dart
          test/usage/usage_pricing_rules_test.dart
          test/usage/usage_proxy_test.dart
          test/usage/usage_shots_test.dart
          test/window/code_args_test.dart
          test/window_header_test.dart
          test/ide/textmate_tokenizer_lifecycle_test.dart
          test/workspace/chat_branch_bar_test.dart
          test/workspace_test.dart
      - name: Test restored native transport and pairing packages
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test packages/bao_iroh/test packages/bao_link/test --timeout 5m
      # Requires a developer's live upstream account and is intentionally
      # skipped when BAOCODE_LIVE_SETTINGS is unset in these offline builds.
      - name: Load optional live review regression
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: flutter test test/e2e_review_real_test.dart
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      # Use an already published remote server. A locally built unpublished
      # manifest would point installed apps at nonexistent download URLs.
      - name: Build Windows x64 installer without upstream auto-update
        run: dart run tool/build_windows.dart --arch x64 --no-updates --remote-release 1.9.0.26-75ba74c4f0cd
      - name: Test packaged Codex process ownership
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $PWD 'build/codex-launcher-fixture/Release'
          python tool/test_codex_owned_launcher.py --helper 'build/windows/x64/runner/Release/BaocodeCodexLauncher.exe' --reject-job-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectJob.exe') --reject-membership-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectMembership.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged owned launcher process isolation tests failed' }
      - name: Smoke-test the release executable
        shell: pwsh
        run: |
          $env:BAOCODE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'baocode-smoke-data'
          New-Item -ItemType Directory -Force $env:BAOCODE_DATA_DIR | Out-Null
          $app = Start-Process 'build/windows/x64/runner/Release/baocode.exe' -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "BaoCode exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Fetch permanent pinned release for isolated upgrade test
        shell: pwsh
        run: |
          # Public versioned URL + verified hash and size; no expiring Actions artifact.
          # Source: b2774ed77d7b858b30a660c31ee32db26e94ec97, release custom-v1.9.0+29.
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-installer'
          New-Item -ItemType Directory -Force $baseline | Out-Null
          $setup = Join-Path $baseline 'BaoCode-1.9.0-setup.exe'
          Invoke-WebRequest 'https://github.com/jiah0231/baocode/releases/download/custom-v1.9.0%2B29/BaoCode-1.9.0-setup.exe' -OutFile $setup
          if ((Get-Item $setup).Length -ne 25766059) { throw 'Pinned release Setup size mismatch' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne '7cd3e5376ac310a01f64f4b8ae71930015ebb6fb8961658e8e5dfc93febaf5dd') { throw 'Pinned release Setup checksum mismatch' }
      - name: Install pinned release then replace in isolated per-user directory
        shell: pwsh
        run: |
          $old = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'baseline-installer') -Filter '*-setup.exe').FullName
          $new = @(Get-ChildItem build/installers -Filter '*-setup.exe')
          if ($new.Count -ne 1) { throw 'Expected one new Setup' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          ./tool/ci/windows_update_smoke.ps1 -OldInstaller $old -NewInstaller $new[0].FullName -NewBundle build/windows/x64/runner/Release -Version $version -OldVersion 1.9.0+29
      - name: Record build identity and checksums
        shell: pwsh
        run: |
          "Source commit: $env:GITHUB_SHA`nBranch: $env:GITHUB_REF_NAME`nWindows x64 custom test build. Upstream updates disabled.`nInstaller replaces an existing BaoCode installation; back up settings first.`nRemote server: 1.9.0.26-75ba74c4f0cd (published upstream build)." | Out-File build/installers/BUILD-INFO.txt -Encoding utf8
          Get-ChildItem build/installers/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File build/installers/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: BaoCode-Codex-Parity-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/installers/*.exe
            build/installers/BUILD-INFO.txt
            build/installers/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: BaoCode-Codex-Parity-Windows-x64-portable
          if-no-files-found: error
          retention-days: 14
          path: build/windows/x64/runner/Release/
