      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Verify unchanged NoteBoard source, licenses and offline bundles
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location tool/office_preview
          try {
            npm ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Pinned preview package resolution failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Offline preview bundle reconstruction failed' }
            node test-upstream.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Unchanged NoteBoard Node regressions failed' }
            node --test test_vendor_integrity.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Preview source, license or bundle integrity failed' }
          } finally {
            Pop-Location
          }
          python tool/ci/reassemble_preview_assets.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt preview bytes differ from pinned originals' }
          git diff --quiet HEAD -- assets/office_preview tool/office_preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction changed the exact candidate source' }
          python tool/office_preview/test/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview fixture provenance or geometry failed' }
