          test/models/proxy/model_proxy_test.dart
          test/models/proxy/translate/claude_from_responses_request_test.dart
      - name: Test combined lag, model picker and Ultra regressions
        run: >-
          flutter test --no-pub --reporter expanded --timeout 2m
          test/chat/chat_history_rebuild_test.dart
          test/chat/history_stream_batch_test.dart
