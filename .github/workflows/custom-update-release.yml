          test/kernel/claude_sdk_tools_test.dart
          test/kernel/dart_core_e2e_test.dart
          test/kernel_test.dart
          test/kernel_ui_test.dart
          test/keybindings/key_chord_test.dart
          test/link/link_host_test.dart
          test/link/workspace_bridge_test.dart
          test/markdown_test.dart
          test/models/proxy/model_proxy_test.dart
          test/remote/remote_project_test.dart
          test/remote/remote_server_test.dart
          test/settings/mobile_page_test.dart
          test/telemetry/telemetry_service_test.dart
          test/update/update_service_test.dart
          test/usage/claude_usage_meter_test.dart
          test/usage/usage_calls_list_test.dart
          test/usage/usage_ledger_test.dart
          test/usage/usage_pricing_rules_test.dart
          test/usage/usage_proxy_test.dart
          test/usage/usage_shots_test.dart
          test/window/code_args_test.dart
          test/window_header_test.dart
          test/ide/textmate_tokenizer_lifecycle_test.dart
          test/workspace/chat_branch_bar_test.dart
          test/workspace_test.dart
      - name: Test restored native transport and pairing packages
        run: flutter test packages/bao_iroh/test packages/bao_link/test --timeout 5m
      # Requires a developer's live upstream account and is intentionally
      # skipped when BAOCODE_LIVE_SETTINGS is unset in these offline builds.
      - name: Load optional live review regression
        run: flutter test test/e2e_review_real_test.dart
      - run: choco install innosetup --no-progress -y
      - name: Verify original font bytes before Windows build
        shell: pwsh
        run: |
          python tool/ci/reassemble_maple_font.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Original font changed before Windows build' }
      - run: dart run tool/build_windows.dart --arch x64 --custom-updates --remote-release 1.9.0.26-75ba74c4f0cd
      - name: Verify bundled original Maple font bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $font = 'build/windows/x64/runner/Release/data/flutter_assets/assets/fonts/maple/MapleMonoNormal-NF-CN-Regular.ttf'
          if ((Get-Item -LiteralPath $font).Length -ne 20563672) { throw 'Bundled font size mismatch' }
          if ((Get-FileHash -LiteralPath $font -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9ae0c348a44a681fa8fa20a34e782e95316cec880102295a128b65760944c0f5') { throw 'Bundled font SHA-256 mismatch' }
      - name: Test packaged Codex process ownership
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $PWD 'build/codex-launcher-fixture/Release'
          python tool/test_codex_owned_launcher.py --helper 'build/windows/x64/runner/Release/BaocodeCodexLauncher.exe' --reject-job-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectJob.exe') --reject-membership-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectMembership.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged owned launcher process isolation tests failed' }
      - name: Verify taskbar task and real multiwindow lifecycle
        timeout-minutes: 8
        shell: pwsh
        run: |
          ./tool/ci/windows_taskbar_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
          if ($LASTEXITCODE -ne 0) { throw 'Taskbar task verification failed' }
          ./tool/ci/windows_multiwindow_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
          if ($LASTEXITCODE -ne 0) { throw 'Real multiwindow verification failed' }
      - name: Verify independent floating translation window
        timeout-minutes: 6
        shell: pwsh
        run: ./tool/ci/windows_translation_window_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-window-release-screenshots
          if-no-files-found: warn
          path: build/translation-window-previews/*
      - name: Smoke-test startup
        shell: pwsh
        run: |
          $env:BAOCODE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'custom-smoke'
          $app = Start-Process 'build/windows/x64/runner/Release/baocode.exe' -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "Startup failed: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Test native Windows session-end shutdown and relaunch
        timeout-minutes: 5
        shell: pwsh
        run: ./tool/ci/windows_session_end_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
      - name: Fetch permanent pinned release for isolated upgrade test
        shell: pwsh
        run: |
          # Public versioned URL + verified hash and size; no expiring Actions artifact.
          # Source: 470e651edca224042acdb24c9b638ef47e657932, release custom-v1.9.1+42.
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-installer'
          New-Item -ItemType Directory -Force $baseline | Out-Null
          $setup = Join-Path $baseline 'BaoCode-1.9.1-setup.exe'
          Invoke-WebRequest 'https://github.com/jiah0231/baocode/releases/download/custom-v1.9.1%2B42/BaoCode-1.9.1-setup.exe' -OutFile $setup
          if ((Get-Item $setup).Length -ne 36833911) { throw 'Pinned release Setup size mismatch' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne 'cf3cb07e0b497bd6529b8e256266002ed1dd029de89109b988131b2ec3362e0f') { throw 'Pinned release Setup checksum mismatch' }
      - name: Install pinned release then replace in isolated per-user directory
        shell: pwsh
        run: |
          $old = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'baseline-installer') -Filter '*-setup.exe').FullName
          $new = @(Get-ChildItem build/installers -Filter '*-setup.exe')
          if ($new.Count -ne 1) { throw 'Expected one new Setup' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          ./tool/ci/windows_update_smoke.ps1 -OldInstaller $old -NewInstaller $new[0].FullName -NewBundle build/windows/x64/runner/Release -Version $version -OldVersion 1.9.1+42
      - name: Install latest pinned custom release then upgrade
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Also exercise the user's latest published build, preserving +42 coverage.
          # Source: 1d305d7b9c5902a9aaee701e5a6f8f75ced2e2ae, custom-v1.9.1+48.
          $old = Join-Path $env:RUNNER_TEMP 'baocode-baseline-48.exe'
          Invoke-WebRequest 'https://github.com/jiah0231/baocode/releases/download/custom-v1.9.1%2B48/BaoCode-1.9.1-setup.exe' -OutFile $old
          if ((Get-Item $old).Length -ne 36889987) { throw 'Latest pinned Setup size mismatch' }
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '11a08cadbc1d24400450e46e2f2226f6fc58e9bb089e3caaf12666bc8cd16b4e') { throw 'Latest pinned Setup checksum mismatch' }
          $new = @(Get-ChildItem build/installers -Filter '*-setup.exe')
          if ($new.Count -ne 1) { throw 'Expected one new Setup' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          ./tool/ci/windows_update_smoke.ps1 -OldInstaller $old -NewInstaller $new[0].FullName -NewBundle build/windows/x64/runner/Release -Version $version -OldVersion 1.9.1+48
      - uses: actions/upload-artifact@v6
        with:
          name: custom-installer
          if-no-files-found: error
          path: build/installers/*.exe
  publish:
    if: >-
      github.repository == 'jiah0231/baocode' && github.actor == 'jiah0231' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'create' && github.event.ref_type == 'branch' &&
        startsWith(github.event.ref, 'custom-publish/v') &&
        endsWith(github.event.ref, format('/{0}', github.sha))))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Restore exact offline preview bundles and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/ci/test_reassemble_preview_assets.py
          python3 tool/ci/reassemble_preview_assets.py
          git diff --quiet HEAD --
      - name: Verify and reassemble the unchanged Maple font
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/ci/test_reassemble_maple_font.py
          python3 tool/ci/reassemble_maple_font.py
          git diff --quiet HEAD --
      - uses: ./.github/actions/bao-iroh-prebuilt
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify requested source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = create ]; then
            version=$(sed -n 's/^version: //p' pubspec.yaml)
            test "$CREATED_REF" = "custom-publish/v$version/$GITHUB_SHA"
          else
            test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          fi
      - run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          name: custom-installer
          path: build/installers
      - name: Verify original font bytes before signing
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/ci/reassemble_maple_font.py --verify-only
      - name: Require independent full translation validation of exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/ci/test_translation_release_gate.py
          # Public read-only API; no expanded token permissions or credentials.
          response="$RUNNER_TEMP/translation-validation.json"
          curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/translation-validation.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > "$response"
          python3 tool/ci/verify_translation_release_gate.py "$GITHUB_SHA" "$response"
      - name: Require independent multiwindow validation of exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/ci/test_multiwindow_release_gate.py
          # Public read-only API; no expanded token permissions or credentials.
          response="$RUNNER_TEMP/multiwindow-validation.json"
          curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/multiwindow-validation.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > "$response"
          python3 tool/ci/verify_multiwindow_release_gate.py "$GITHUB_SHA" "$response"
      - name: Sign and publish verified build; advertise last
        env:
          SIGNING_SEED: ${{ secrets.BAOCODE_CUSTOM_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_SEED" > "$key"
          export BAOCODE_CUSTOM_UPDATE_SIGNING_KEY_FILE="$key"
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          tag="custom-v$version"
          # Never overwrite a versioned release or reuse a version number.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Version already published; increment both app version files.' >&2; exit 1
          fi
          # --target does not replace a pre-existing tag. Refuse one so the
          # versioned release cannot silently name a different source commit.
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$existing_tag" ]; then
            echo 'Version tag already exists; inspect it and use a new version.' >&2; exit 1
          fi
          installers=(build/installers/*-setup.exe)
          test "${#installers[@]}" -eq 1
          # This established channel must be readable. A network/API failure is
          # not permission to skip monotonic-version validation or recreate it.
          mkdir -p "$RUNNER_TEMP/previous-update"
          gh release download custom-stable --pattern latest.json --dir "$RUNNER_TEMP/previous-update"
          previous=("$RUNNER_TEMP/previous-update/latest.json")
          dart run tool/custom_release_manifest.dart "$version" "${installers[0]}" build/installers/latest.json "${previous[@]}"
          notes="$RUNNER_TEMP/custom-release-notes.md"
          if [ -f "release-notes/custom-$version.zh.md" ]; then
            cat "release-notes/custom-$version.zh.md" > "$notes"
            printf '\n\n' >> "$notes"
          fi
          printf 'Tested source: %s. Signed Windows x64 custom update.\n' "$GITHUB_SHA" >> "$notes"
          gh release create "$tag" "${installers[0]}" --target "$GITHUB_SHA" --draft --title "Custom BaoCode $version" --notes-file "$notes"
          gh release edit "$tag" --draft=false --latest=false
          git fetch --no-tags origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          # Confirm the public versioned download is the tested and signed payload
          # before advertising it to installed apps. Never execute the download here.
          verify="$RUNNER_TEMP/published-verification"
          mkdir -p "$verify"
          gh release download "$tag" --pattern '*-setup.exe' --dir "$verify"
          cmp "${installers[0]}" "$verify/$(basename "${installers[0]}")"
          # custom-stable is only a manifest pointer; versioned Setup is live first.
          gh release upload custom-stable build/installers/latest.json --clobber
          gh release download custom-stable --pattern latest.json --dir "$verify"
          cmp build/installers/latest.json "$verify/latest.json"
          echo "Verified published installer bytes and signed update manifest for $version ($GITHUB_SHA)."
