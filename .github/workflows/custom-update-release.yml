# Publishing requires owner creation of an exact-SHA release request branch,
# or explicit manual dispatch. Ordinary code pushes never publish updates.
name: Custom signed Windows update
on:
  create:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact reviewed source commit SHA (must match selected branch)'
        type: string
        required: true
      publish:
        description: 'Publish the tested build to the custom update channel'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: custom-update-release
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'jiah0231/baocode' && github.actor == 'jiah0231' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'custom-publish/v') &&
        endsWith(github.event.ref, format('/{0}', github.sha))))
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/bao-iroh-prebuilt
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify requested source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = create ]; then
            version=$(sed -n 's/^version: //p' pubspec.yaml)
            test "$CREATED_REF" = "custom-publish/v$version/$GITHUB_SHA"
          else
            test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          fi
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-pub
        id: analyze
      - name: Build and test owned Windows Codex launcher
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S windows/codex_launcher -B build/codex-launcher-fixture -A x64 -DBAOCODE_LAUNCHER_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher configure failed' }
          cmake --build build/codex-launcher-fixture --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher build failed' }
          $fixture = Join-Path $PWD 'build/codex-launcher-fixture/Release'
          $helper = Join-Path $fixture 'BaocodeCodexLauncher.exe'
          if (-not (Test-Path -LiteralPath $helper)) { throw 'Owned launcher fixture missing' }
          "BAOCODE_TEST_LAUNCHER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tool/test_codex_owned_launcher.py --helper $helper --reject-job-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectJob.exe') --reject-membership-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectMembership.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Owned launcher process isolation tests failed' }
      - name: Test Codex provider MCP and shutdown regressions early
        run: >-
          flutter test
          test/kernel/codex_provider_route_test.dart
          test/kernel/codex_owned_process_test.dart
          test/kernel/codex_transport_shutdown_test.dart
          test/kernel/codex_transport_decode_test.dart
          test/kernel/codex_path_setting_test.dart
          test/kernel/codex_bot_kernel_test.dart
          test/kernel/codex_writer_lifecycle_test.dart
      - name: Test browser recorder privacy scripts
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: node --test test/browser/browser_recorder_script_test.mjs
      - name: Test browser routing and human takeover early
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test
          test/browser/browser_panel_controller_test.dart
          test/browser/browser_frame_flow_test.dart
          test/browser/browser_agent_control_test.dart
          test/browser/browser_analysis_test.dart
          test/browser/browser_bridge_test.dart
          test/browser/browser_numbers_test.dart
          test/browser/browser_steps_test.dart
          test/browser/extension_store_test.dart
          test/browser/source_map_test.dart
          test/kernel/codex_install_http_diagnostics_test.dart
      - name: Test real Chrome takeover with isolated CDP fixture
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        env:
          BAOCODE_REAL_CHROME_SMOKE: '1'
          BAOCODE_CFT_VERSION: '156.0.8078.80'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('bao-cft-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            # Official version-specific metadata; no installed-browser fallback.
            $expected = 'https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/win64/chrome-win64.zip'
            $metadata = Invoke-RestMethod "https://googlechromelabs.github.io/chrome-for-testing/$($env:BAOCODE_CFT_VERSION).json" -TimeoutSec 60
            $asset = @($metadata.downloads.chrome | Where-Object { $_.platform -eq 'win64' })
            if ($metadata.version -ne $env:BAOCODE_CFT_VERSION -or $asset.Count -ne 1 -or $asset[0].url -ne $expected) { throw 'Pinned official Chrome for Testing metadata mismatch' }
            $archive = Join-Path $root 'chrome-win64.zip'
            Invoke-WebRequest $expected -OutFile $archive -TimeoutSec 180
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne '16edb57d6107bf1c48a7c149b8d78b155fe614410093796dd72441fd6640540f') { throw 'Pinned Chrome for Testing archive checksum mismatch' }
            Write-Host "Chrome for Testing $($env:BAOCODE_CFT_VERSION) | $expected | archive SHA256 $hash"
            Expand-Archive -LiteralPath $archive -DestinationPath $root
            $env:BAOCODE_CHROME_FOR_TESTING = Join-Path $root 'chrome-win64\chrome.exe'
            if (-not (Test-Path -LiteralPath $env:BAOCODE_CHROME_FOR_TESTING)) { throw 'Official Chrome for Testing executable missing' }
            # Fresh disposable profile, local pages, loopback CDP, no extension
            # installation/registry changes. Not native-host/extension E2E.
            flutter test test/browser/browser_takeover_real_chrome_test.dart test/browser/browser_mirror_real_chrome_test.dart --concurrency=1 --fail-fast --reporter expanded --timeout 3m
            if ($LASTEXITCODE -ne 0) { throw 'Real Chrome takeover smoke failed' }
          } finally {
            # Only the binary/archive directory created by this exact step.
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
      - name: Test Chrome panel widget interactions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        timeout-minutes: 5
        run: flutter test test/browser/browser_toolbar_test.dart test/browser/browser_mirror_test.dart
      - name: Test Codex approval and edit-review UI early
        run: flutter test test/kernel_ui_test.dart --plain-name "a Codex agent asks leave, and its work can be undone"
      - name: Test selected cross-kernel session retrieval
        run: flutter test test/chat/session_query_test.dart test/chat/session_query_queue_test.dart test/chat/session_query_claude_lifecycle_test.dart test/chat/session_mentions_test.dart test/chat/composer_intercept_test.dart test/chat/composer_draft_sync_test.dart test/workspace/session_query_workspace_test.dart
      - name: Test updater and quit protections
        run: flutter test test/update test/workspace/quit_confirmation_test.dart test/workspace/usage_shutdown_test.dart
      - name: Test custom build configuration
        run: flutter test test/update/custom_update_channel_test.dart --dart-define=BAOCODE_CUSTOM_UPDATES=true --dart-define=BAOCODE_CUSTOM_UPDATE_KEY=$env:BAOCODE_CUSTOM_UPDATE_KEY
      - name: Repeat writer lifecycle regression with randomized order
        run: |
          foreach ($seed in 101, 211, 307, 401, 503) {
            flutter test test/kernel/codex_writer_lifecycle_test.dart --test-randomize-ordering-seed=$seed
            if ($LASTEXITCODE -ne 0) { throw "Writer lifecycle regression failed (seed $seed)" }
          }
      - name: Test preserved Codex and performance functionality
        run: flutter test test/kernel test/usage test/models/proxy test/models/codex_test.dart test/codex_fork_test.dart test/chat/streamed_words_test.dart
      - name: Test upstream edit ledger and legacy SSH compatibility
        run: >-
          flutter test
          test/chat/change_review_test.dart
          test/chat/checkpoints_tidy_test.dart
          test/chat/legacy_review_import_test.dart
          test/chat/line_diff_test.dart
          test/chat/session_review_test.dart
          test/remote/remote_review_compat_test.dart
          test/remote/remote_server_test.dart
          packages/bao_agent/test/engine/host_hooks_test.dart
      - name: Test upstream chat, usage UI, search and editor integration
        run: >-
          flutter test
          test/chat/composer_intercept_test.dart
          test/chat/reset_credits_hint_test.dart
          test/chat/side_panel/file_preview_agent_test.dart
          test/chat/side_panel/side_panel_test.dart
          test/ide/editor/ide_editor_agent_edits_test.dart
          test/ide/git/log_details_copy_test.dart
          test/ide/git/log_diff_test.dart
          test/ide/search/text_search_test.dart
          test/ide/workbench/ide_units_test.dart
          test/usage_panel_test.dart
          test/workspace/aside_test.dart
          test/workspace/chat_branch_bar_test.dart
          test/workspace/chat_quota_bar_test.dart
      - name: Test full kernel integration and current phone protocol
        run: flutter test test/kernel_test.dart test/link
      - name: Test all upstream changed regressions
        run: >-
          flutter test
          test/base/mouse_navigation_test.dart
          test/bots/bots_test.dart
          test/chat/change_review_test.dart
          test/chat/checkpoints_tidy_test.dart
          test/chat/composer_draft_sync_test.dart
          test/chat/composer_intercept_test.dart
          test/chat/goal_panel_test.dart
          test/chat/history_selection_test.dart
          test/chat/session_mentions_test.dart
          test/chat/side_panel/side_panel_reopen_diff_test.dart
          test/chat/side_panel/side_panel_test.dart
          test/chat/streamed_words_test.dart
          test/chat_split_test.dart
          test/claude_haiku_test.dart
          test/customize/customize_view_test.dart
          test/diagnostics/frame_watch_test.dart
          test/forge/forge_test.dart
          test/forge/forge_tls_test.dart
          test/ide/editor/ide_editor_agent_edits_test.dart
          test/ide/git/log_diff_test.dart
          test/ide/lsp/catalog/bundled_lsp_catalog_test.dart
          test/ide/lsp/core/lsp_manager_test.dart
          test/ide/lsp/core/vue_language_tools_test.dart
          test/ide/lsp/packs/lsp_settings_template_test.dart
          test/ide/lsp/smoke/vue_language_server_smoke_test.dart
          test/ide/search/search_view_test.dart
          test/ide/terminal/links/terminal_links_test.dart
          test/ide/workbench/navigation_history_test.dart
          test/kernel/claude_haiku_test.dart
          test/kernel/claude_sdk_tools_test.dart
          test/kernel/dart_core_e2e_test.dart
          test/kernel_test.dart
          test/kernel_ui_test.dart
          test/keybindings/key_chord_test.dart
          test/link/link_host_test.dart
          test/link/workspace_bridge_test.dart
          test/markdown_test.dart
          test/models/proxy/model_proxy_test.dart
          test/remote/remote_project_test.dart
          test/remote/remote_server_test.dart
          test/settings/mobile_page_test.dart
          test/telemetry/telemetry_service_test.dart
          test/update/update_service_test.dart
          test/usage/claude_usage_meter_test.dart
          test/usage/usage_calls_list_test.dart
          test/usage/usage_ledger_test.dart
          test/usage/usage_pricing_rules_test.dart
          test/usage/usage_proxy_test.dart
          test/usage/usage_shots_test.dart
          test/window/code_args_test.dart
          test/window_header_test.dart
          test/ide/textmate_tokenizer_lifecycle_test.dart
          test/workspace/chat_branch_bar_test.dart
          test/workspace_test.dart
      - name: Test restored native transport and pairing packages
        run: flutter test packages/bao_iroh/test packages/bao_link/test --timeout 5m
      # Requires a developer's live upstream account and is intentionally
      # skipped when BAOCODE_LIVE_SETTINGS is unset in these offline builds.
      - name: Load optional live review regression
        run: flutter test test/e2e_review_real_test.dart
      - run: choco install innosetup --no-progress -y
      - run: dart run tool/build_windows.dart --arch x64 --custom-updates --remote-release 1.7.3.23-958eff42c6ca
      - name: Test packaged Codex process ownership
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $PWD 'build/codex-launcher-fixture/Release'
          python tool/test_codex_owned_launcher.py --helper 'build/windows/x64/runner/Release/BaocodeCodexLauncher.exe' --reject-job-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectJob.exe') --reject-membership-helper (Join-Path $fixture 'BaocodeCodexLauncherRejectMembership.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged owned launcher process isolation tests failed' }
      - name: Smoke-test startup
        shell: pwsh
        run: |
          $env:BAOCODE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'custom-smoke'
          $app = Start-Process 'build/windows/x64/runner/Release/baocode.exe' -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "Startup failed: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Fetch permanent pinned release for isolated upgrade test
        shell: pwsh
        run: |
          # Public versioned URL + verified hash and size; no expiring Actions artifact.
          # Source: c5e0be914dcb4c43b8d91c01bb1afb39b4bbe94a, release custom-v1.8.0+27.
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline-installer'
          New-Item -ItemType Directory -Force $baseline | Out-Null
          $setup = Join-Path $baseline 'BaoCode-1.8.0-setup.exe'
          Invoke-WebRequest 'https://github.com/jiah0231/baocode/releases/download/custom-v1.8.0%2B27/BaoCode-1.8.0-setup.exe' -OutFile $setup
          if ((Get-Item $setup).Length -ne 25664878) { throw 'Pinned release Setup size mismatch' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne '8c8b528d4b7baecec19d442135b7a858c0e836a9efda779951c0d244019fccbe') { throw 'Pinned release Setup checksum mismatch' }
      - name: Install pinned release then replace in isolated per-user directory
        shell: pwsh
        run: |
          $old = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'baseline-installer') -Filter '*-setup.exe').FullName
          $new = @(Get-ChildItem build/installers -Filter '*-setup.exe')
          if ($new.Count -ne 1) { throw 'Expected one new Setup' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          ./tool/ci/windows_update_smoke.ps1 -OldInstaller $old -NewInstaller $new[0].FullName -NewBundle build/windows/x64/runner/Release -Version $version -OldVersion 1.8.0+27
      - uses: actions/upload-artifact@v6
        with:
          name: custom-installer
          if-no-files-found: error
          path: build/installers/*.exe
  publish:
    if: >-
      github.repository == 'jiah0231/baocode' && github.actor == 'jiah0231' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'create' && github.event.ref_type == 'branch' &&
        startsWith(github.event.ref, 'custom-publish/v') &&
        endsWith(github.event.ref, format('/{0}', github.sha))))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/bao-iroh-prebuilt
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify requested source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = create ]; then
            version=$(sed -n 's/^version: //p' pubspec.yaml)
            test "$CREATED_REF" = "custom-publish/v$version/$GITHUB_SHA"
          else
            test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          fi
      - run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          name: custom-installer
          path: build/installers
      - name: Sign and publish verified build; advertise last
        env:
          SIGNING_SEED: ${{ secrets.BAOCODE_CUSTOM_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_SEED" > "$key"
          export BAOCODE_CUSTOM_UPDATE_SIGNING_KEY_FILE="$key"
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          tag="custom-v$version"
          # Never overwrite a versioned release or reuse a version number.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Version already published; increment both app version files.' >&2; exit 1
          fi
          installers=(build/installers/*-setup.exe)
          test "${#installers[@]}" -eq 1
          previous=()
          if gh release view custom-stable >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/previous-update"
            gh release download custom-stable --pattern latest.json --dir "$RUNNER_TEMP/previous-update"
            previous=("$RUNNER_TEMP/previous-update/latest.json")
          fi
          dart run tool/custom_release_manifest.dart "$version" "${installers[0]}" build/installers/latest.json "${previous[@]}"
          gh release create "$tag" "${installers[0]}" --target "$GITHUB_SHA" --draft --title "Custom BaoCode $version" --notes "Tested source: $GITHUB_SHA. Signed Windows x64 custom update."
          gh release edit "$tag" --draft=false --latest=false
          # custom-stable is only a manifest pointer; versioned Setup is live first.
          if ! gh release view custom-stable >/dev/null 2>&1; then
            gh release create custom-stable --target "$GITHUB_SHA" --title 'Custom stable update channel' --notes 'Signed update manifest for custom Windows installations.' --latest=false
          fi
          gh release upload custom-stable build/installers/latest.json --clobber
