# Publishing requires owner creation of an exact-SHA release request branch,
# or explicit manual dispatch. Ordinary code pushes never publish updates.
name: Custom signed Windows update
on:
  create:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact reviewed source commit SHA (must match selected branch)'
        type: string
        required: true
      publish:
        description: 'Publish the tested build to the custom update channel'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Ordinary branch creation must not occupy (or replace a pending run in)
  # the real release queue. The jobs below apply the same release gate.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'custom-publish/v') &&
          endsWith(github.event.ref, format('/{0}', github.sha)))) &&
        'custom-update-release' || format('custom-update-noop-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'jiah0231/baocode' && github.actor == 'jiah0231' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'custom-publish/v') &&
        endsWith(github.event.ref, format('/{0}', github.sha))))
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Restore exact offline preview bundles and corresponding source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tool/ci/test_reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview transport unit tests failed' }
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview original-byte reconstruction failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction changed tracked source' }
      - name: Verify and reassemble the unchanged Maple font
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tool/ci/test_reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction unit tests failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Original font reconstruction failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction changed tracked source' }
      - uses: ./.github/actions/bao-iroh-prebuilt
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Verify requested source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = create ]; then
            version=$(sed -n 's/^version: //p' pubspec.yaml)
            test "$CREATED_REF" = "custom-publish/v$version/$GITHUB_SHA"
          else
            test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          fi
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Verify generated source matches reviewed commit
        shell: pwsh
        run: |
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs from reviewed commit' }
      - run: flutter analyze --no-pub
        id: analyze
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify cross-app translation selection privacy
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_smoke.ps1
      - name: Test guarded explicit selection copying
        shell: pwsh
        run: ./tool/ci/windows_translation_clipboard_smoke.ps1
      - name: Test nonactivating selection action entry
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_action_smoke.ps1
      - name: Test default Edge selection capture
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: |
          1..3 | ForEach-Object {
            Write-Host "Fresh Edge cold-start verification $_ / 3"
            ./tool/ci/windows_translation_browser_smoke.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Fresh Edge selection verification failed' }
          }
      - name: Verify real desktop application coverage observations
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_desktop_smoke.ps1 -OutputDirectory build/translation-desktop-coverage -RequireExactCapture @('notepad', 'edgePdf')
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-desktop-release-coverage
          if-no-files-found: warn
          path: build/translation-desktop-coverage/
      - name: Verify real Windows Terminal selection
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_terminal_smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-terminal-release-coverage
          if-no-files-found: warn
          path: build/translation-terminal-coverage/
      - name: Verify real desktop translation entry clicks
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_desktop_entry_smoke.ps1 -OutputDirectory build/translation-desktop-entry
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-desktop-entry-release
          if-no-files-found: warn
          path: build/translation-desktop-entry/
      - name: Check translation source formatting
        run: dart format --output=none --set-exit-if-changed lib/translation test/translation lib/settings/pages/language_page.dart lib/settings/pages/stash_hotkey_field.dart lib/settings/app_settings.dart
      - name: Test translation routing, cancellation and theme layouts
        run: flutter test --no-pub --reporter expanded --timeout 2m test/translation
      - name: Check Quick Ask source formatting
        run: >-
