name: Edge public PDF selection diagnostic
on:
  push:
    branches: ['test/edge-native-copy-20261114']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    if: github.repository == 'jiah0231/baocode'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Check bounded IA2 diagnostic structure
        shell: pwsh
        run: |
          python tool/ci/verify_edge_pdf_ia2_probe.py --self-test --script tool/ci/run_edge_pdf_probe.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Base structural guard failed' }
          python tool/ci/verify_edge_pdf_chromium_selection_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Chromium identity guard failed' }
          python tool/ci/verify_edge_pdf_selected_embedded_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Selected object guard failed' }
      - name: Fetch and verify public fixture
        shell: pwsh
        run: |
          $pdf = Join-Path $env:RUNNER_TEMP '2608.11260.pdf'
          Invoke-WebRequest -Uri 'https://arxiv.org/pdf/2608.11260' -OutFile $pdf
          if ((Get-FileHash $pdf -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd159155dffad685a388562d1d2a4e0f869a5473be90c6c06381ab68a381451dc') { throw 'Public fixture changed' }
      - name: Probe exact IA2 selected range
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: |
          ./tool/ci/run_edge_pdf_probe.ps1 -Repository . -Pdf (Join-Path $env:RUNNER_TEMP '2608.11260.pdf') -Output (Join-Path $env:RUNNER_TEMP 'edge-public-pdf-evidence') -Zoom 150 -ScrollY 450 -ExpectedDpi 96 -FromX 516 -FromY 532 -ToX 616 -ToY 532 -Warm -IA2 -ChromiumBoundIA2 -SelectedEmbeddedIA2 -SelectedParagraphIA2
      - name: Keep isolated public PDF evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: edge-native-copy-${{ matrix.os }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/edge-public-pdf-evidence/
