# Isolated focused regression run. No publishing, signing, browser, or installer.
name: Default-app preview focused checks
on:
  push:
    branches: ['validation/non-chrome-default-app-20261106']
permissions:
  contents: read
concurrency:
  group: default-app-preview-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore exact bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
          git diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Asset reconstruction changed tracked source' }
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Resolve packages and localization
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization generation failed' }
      - name: Analyze default-app regression
        run: flutter analyze --no-pub test/chat/side_panel/file_preview_default_app_test.dart
      - name: Test default-app and document previews
        timeout-minutes: 4
        run: >-
          flutter test --no-pub --reporter expanded --timeout 45s --concurrency=1
          test/chat/side_panel/file_preview_default_app_test.dart
          test/chat/side_panel/file_preview_document_test.dart
