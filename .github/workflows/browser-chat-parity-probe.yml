# Incremental Web probe: shared desktop chat contract and column.
# Synthetic conversations only. No uploads, desktop connection, or publication.
name: Browser chat parity compile probe
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-chat:
    if: >-
      github.repository == 'jiah0231/baocode' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' && github.event.ref == 'feat/edge-assistant-native-citation-seam'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Restore source and asset inputs
        id: restore
        run: |
          set -euo pipefail
          python3 tool/ci/reassemble_preview_assets.py
          python3 tool/ci/reassemble_maple_font.py
          git diff --exit-code HEAD --
          flutter pub get
          flutter gen-l10n
      - name: Verify native messaging envelope budget
        run: flutter test --no-pub test/browser/sidebar_frame_budget_test.dart
      - name: Verify native code citation behavior
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub test/chat/code_citation_test.dart
      - name: Check shared Markdown, find UI, theme inputs, and fixture
        run: |
          set -euo pipefail
          for file in lib/chat/widgets/code_citation{,_actions_native,_actions_web}.dart lib/theme/{app_theme,code_font,render_theme,render_theme_native,render_theme_web}.dart lib/chat/chat_find{,_bar}.dart lib/chat/chat_history_view.dart lib/chat/widgets/markdown_{view,file_actions_native,file_actions_web,options}.dart tool/preview/browser_original_assistant.dart; do
            dart analyze --no-fatal-warnings "$file"
          done
      - name: Verify Windows chat typography in Chromium
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub --platform chrome test/browser/chromium/render_theme_web_test.dart
      - name: Compile original assistant prose on Web
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          flutter build web --no-pub --csp --no-web-resources-cdn --target=tool/preview/browser_original_assistant.dart
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test -s build/web/canvaskit/canvaskit.wasm
