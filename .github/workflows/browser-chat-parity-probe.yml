# Incremental Web probe: shared desktop chat contract and column.
# Synthetic conversations only. No desktop connection or release publication.
name: Browser chat parity compile probe
on:
  create:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-chat:
    if: >-
      github.repository == 'jiah0231/baocode' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' && github.event.ref == 'feat/edge-sidebar-copy-text'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Restore source and asset inputs
        id: restore
        run: |
          set -euo pipefail
          python3 tool/ci/reassemble_preview_assets.py
          python3 tool/ci/reassemble_maple_font.py
          git diff --exit-code HEAD --
          flutter pub get
          flutter gen-l10n
      - name: Verify sidebar prose snapshot and envelope budget
        run: flutter test --no-pub test/browser/sidebar_frame_budget_test.dart test/browser/sidebar_prose_snapshot_test.dart test/browser/sidebar_direct_catalog_test.dart
      - name: Verify native code citation behavior
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub test/chat/code_citation_test.dart
      - name: Verify native diagram and image rendering
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub test/chat/mermaid_code_block_test.dart test/chat/content_image_test.dart
      - name: Verify fold and preview pointer behavior
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub test/chat/step_header_preview_click_test.dart test/markdown_test.dart
      - name: Check shared Markdown, find UI, theme inputs, and fixture
        run: |
          set -euo pipefail
          for file in lib/chat/widgets/{preview_click,shimmer_text,step_header,image_thumbnails}.dart lib/chat/widgets/{content_image,content_image_placeholder,mermaid_code_block,mermaid_picture_actions_native,mermaid_picture_actions_web}.dart lib/chat/widgets/code_citation{,_actions_native,_actions_web}.dart lib/theme/{app_theme,code_font,render_theme,render_theme_native,render_theme_web}.dart lib/chat/chat_find{,_bar}.dart lib/chat/chat_history_view.dart lib/chat/widgets/markdown_{view,file_actions_native,file_actions_web,options}.dart tool/preview/browser_original_assistant.dart; do
            dart analyze --no-fatal-warnings "$file"
          done
      - name: Verify Windows chat typography, running step and rendered copy text in Chromium
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: flutter test --no-pub --platform chrome test/browser/chromium/render_theme_web_test.dart test/browser/chromium/running_step_header_test.dart test/browser/chromium/sidebar_markdown_copy_test.dart
      - name: Compile original assistant prose on Web
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          flutter build web --no-pub --pwa-strategy=none --base-href=/ --csp --no-web-resources-cdn --target=tool/preview/browser_original_assistant.dart
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test -s build/web/canvaskit/canvaskit.wasm
      - name: Stage an isolated MV3 fixture
        run: |
          set -euo pipefail
          mkdir -p build/assistant-mv3
          cp -a build/web/. build/assistant-mv3/
          cp tool/preview/assistant_mv3/{manifest.json,fixture-worker.js} build/assistant-mv3/
          sed -i '/<link rel="manifest" href="manifest.json">/d' build/assistant-mv3/index.html
          rm -f build/assistant-mv3/flutter_service_worker.js
      - name: Install pinned Chromium smoke runner
        run: |
          set -euo pipefail
          mkdir -p build/assistant-smoke
          npm install --prefix build/assistant-smoke --no-audit --no-fund --save-exact playwright@1.56.1
          build/assistant-smoke/node_modules/.bin/playwright install --with-deps chromium
          cp tool/preview/assistant_mv3/smoke.cjs build/assistant-smoke/
      - name: Start the original chat fixture under the extension policy
        run: |
          node build/assistant-smoke/smoke.cjs build/assistant-mv3 build/assistant-screens
      - name: Preserve synthetic screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: assistant-mv3-screens
          path: build/assistant-screens/
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve unpacked fixture for a Windows Edge smoke
        uses: actions/upload-artifact@v4
        with:
          name: assistant-mv3-fixture-not-a-release
          path: build/assistant-mv3/
          if-no-files-found: error
          retention-days: 3
