name: Pairing regression (no release)
on:
  push:
    branches: ['validation/pairing-*']
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: false
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Restore bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
      - name: Resolve packages
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
      - name: Format changed files
        run: dart format --output=none --set-exit-if-changed lib/link/link_host.dart test/link/link_host_test.dart
      - name: Pairing regressions
        run: flutter test --no-pub test/link/link_host_test.dart
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos
