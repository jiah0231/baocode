# Explicit feature validation only: no live model calls, signing or publication.
name: Global translation validation
on:
  push:
    branches: ['feat/global-translation*']
permissions:
  contents: read
concurrency:
  group: translation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test cross-process selection and clipboard protection
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_smoke.ps1
      - name: Test guarded explicit selection copying
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tool/ci/windows_translation_clipboard_smoke.ps1
      - name: Test nonactivating selection action entry
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_action_smoke.ps1
      - name: Test default Edge selection capture
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: |
          1..3 | ForEach-Object {
            Write-Host "Fresh Edge cold-start verification $_ / 3"
            ./tool/ci/windows_translation_browser_smoke.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Fresh Edge selection verification failed' }
          }
  validate:
    if: github.repository == 'jiah0231/baocode' && github.ref != 'refs/heads/feat/global-translation-native-tests'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore unchanged bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Asset restoration changed source' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve packages and localization
        id: resolve
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs' }
      - name: Analyze reviewed source
        id: analyze
        run: flutter analyze --no-pub --fatal-infos
      - name: Check translation formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/translation test/translation lib/workbench.dart
          lib/chat/chat_history_view.dart lib/ide/ide_editor.dart lib/ide/ide_code_editor.dart
          lib/settings/app_settings.dart lib/settings/pages/language_page.dart
          lib/settings/pages/stash_hotkey_field.dart lib/keybindings/window_keybindings.dart
          lib/l10n/command_titles.dart test/keybindings/window_keybindings_test.dart
      - name: Test translation and related regressions
        shell: pwsh
        run: |
          flutter test --no-pub --reporter expanded --timeout 2m --dart-define=TRANSLATION_PREVIEWS=true test/translation test/quick_ask test/keybindings/window_keybindings_test.dart test/chat/history_selection_test.dart test/settings/settings_wiring_test.dart test/settings/stash_hotkey_field_test.dart test/settings/models_page_test.dart test/ide/ide_input_test.dart test/ide/ide_menu_test.dart test/update/version_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Translation regressions failed' }
      - name: Export synthetic preview images for review
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem 'build/translation-previews/*.png' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output ('TRANSLATION_PREVIEW|' + $_.BaseName + '|' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-visual-previews
          if-no-files-found: warn
          path: build/translation-previews/*.png

  windows_app:
    if: github.repository == 'jiah0231/baocode' && github.ref != 'refs/heads/feat/global-translation-native-tests'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      BAOCODE_CUSTOM_UPDATE_KEY: ${{ vars.BAOCODE_CUSTOM_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore unchanged bundled assets
        shell: pwsh
        run: |
          python tool/ci/reassemble_preview_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview reconstruction failed' }
          python tool/ci/reassemble_maple_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Font reconstruction failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Asset restoration changed source' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve packages and localization
        id: resolve
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Package resolution failed' }
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Generated source differs' }
      - name: Build actual Windows release app
        id: build
        shell: pwsh
        run: |
          dart run tool/build_windows.dart --arch x64 --custom-updates --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
      - name: Retain isolated test bundle for diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: translation-test-bundle-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: build/windows/x64/runner/Release/
      - name: Test real independent translation window
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./tool/ci/windows_translation_window_smoke.ps1 -Executable build/windows/x64/runner/Release/baocode.exe
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-real-window-previews
          if-no-files-found: error
          path: build/translation-window-previews/*.png

  desktop:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Observe real Windows desktop selection coverage
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_desktop_smoke.ps1 -OutputDirectory build/translation-desktop-coverage -RequireExactCapture @('notepad')
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-desktop-coverage
          if-no-files-found: error
          path: build/translation-desktop-coverage/

  terminal:
    if: github.repository == 'jiah0231/baocode'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify real Windows Terminal selection
        shell: pwsh
        env:
          BAOCODE_DISPOSABLE_UI_TEST: '1'
        run: ./tool/ci/windows_translation_terminal_smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: translation-terminal-coverage
          if-no-files-found: error
          path: build/translation-terminal-coverage/
